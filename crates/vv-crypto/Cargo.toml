[package]
name = "vv-crypto"
version = "0.0.0"
description = "VV1 cryptographic suite, strict CBOR and protocol envelopes (docs/protocol.md)"
edition.workspace = true
publish.workspace = true

[dependencies]
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
hkdf = "0.12"
hpke = { version = "0.14.1", default-features = false, features = ["x25519", "alloc", "chacha", "hkdfsha2"] }
sha2 = "0.10"
thiserror = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
hex = "0.4"
serde_json = "1"
