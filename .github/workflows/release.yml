name: Release

# Each app releases on its own tag, pushed by a maintainer after the version
# bump is merged (see .claude/skills/release/SKILL.md):
#
#   node-v0.6.0    community-node binaries (draft GitHub release), image, Railway
#   portal-v0.6.0  portal image, Railway
#   mobile-v1.1.0  EAS build and submit: iOS to TestFlight, Android to the
#                  Play internal track
#
# The tag must match the version in the app's file (scripts/release-version.mjs).
# Images are tagged v<version> and latest.
on:
  push:
    tags: ["node-v*", "portal-v*", "mobile-v*"]

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.tag.outputs.app }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: tag
        run: node scripts/release-version.mjs check-tag "${{ github.ref_name }}"

  # --- node ----------------------------------------------------------------

  binaries:
    needs: resolve
    if: needs.resolve.outputs.app == 'node'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu } # Raspberry Pi OS 64-bit, ARM servers
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build -p community-node --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=community-node-v${{ needs.resolve.outputs.version }}-${{ matrix.target }}
          mkdir "$name"
          cp README.md apps/node/README.md apps/node/config.example.toml deploy/community-node.service "$name"/ 2>/dev/null || true
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/${{ matrix.target }}/release/community-node.exe "$name"/
            7z a "$name.zip" "$name" >/dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp target/${{ matrix.target }}/release/community-node "$name"/
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: community-node-*.*

  publish:
    needs: [resolve, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          name: community-node v${{ needs.resolve.outputs.version }}
          files: community-node-*

  node-image:
    needs: resolve
    if: needs.resolve.outputs.app == 'node'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/community-node:v${{ needs.resolve.outputs.version }}
            ${{ needs.resolve.outputs.prerelease != 'true' && format('ghcr.io/{0}/community-node:latest', github.repository_owner) || '' }}

  # --- portal --------------------------------------------------------------

  portal-image:
    needs: resolve
    if: needs.resolve.outputs.app == 'portal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/portal/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vamo-virar-portal:v${{ needs.resolve.outputs.version }}
            ${{ needs.resolve.outputs.prerelease != 'true' && format('ghcr.io/{0}/vamo-virar-portal:latest', github.repository_owner) || '' }}

  # Points the released service on Railway at the new image and waits for it
  # to come up (scripts/deploy-railway.mjs). Skipped without the RAILWAY_TOKEN
  # secret and for pre-releases; see apps/portal/README.md, "Atualizar no Railway".
  deploy-railway:
    needs: [resolve, node-image, portal-image]
    if: always() && (needs.node-image.result == 'success' || needs.portal-image.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/deploy-railway.mjs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          IMAGE_TAG: v${{ needs.resolve.outputs.version }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          RAILWAY_NODE_SERVICE: ${{ needs.resolve.outputs.app == 'node' && (vars.RAILWAY_NODE_SERVICE || 'node') || '' }}
          RAILWAY_PORTAL_SERVICE: ${{ needs.resolve.outputs.app == 'portal' && (vars.RAILWAY_PORTAL_SERVICE || 'portal') || '' }}

  # --- mobile --------------------------------------------------------------

  # Builds both stores' binaries on EAS from this tag and submits them: iOS to
  # App Store Connect (TestFlight), Android to the Play internal track. Store
  # review and production rollout stay manual in the consoles. Build numbers
  # come from EAS (appVersionSource: remote); the store version is the tag's.
  mobile-eas:
    needs: resolve
    if: needs.resolve.outputs.app == 'mobile'
    runs-on: ubuntu-latest
    steps:
      - name: EXPO_TOKEN is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret (an Expo access token) to release the mobile app."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # Expo config plugins resolve from node_modules when EAS reads app.json.
      - run: npm ci
      - name: Build and submit (iOS and Android)
        working-directory: apps/mobile
        run: |
          eas build --platform all --profile production --auto-submit --non-interactive \
            --message "mobile-v${{ needs.resolve.outputs.version }} (${GITHUB_SHA::7})"
