name: Release

# Runs only when a maintainer pushes a version tag (e.g. v0.1.0).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu } # Raspberry Pi OS 64-bit, ARM servers
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build -p community-node --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=community-node-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          cp README.md apps/node/README.md apps/node/config.example.toml deploy/community-node.service "$name"/ 2>/dev/null || true
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/${{ matrix.target }}/release/community-node.exe "$name"/
            7z a "$name.zip" "$name" >/dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp target/${{ matrix.target }}/release/community-node "$name"/
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: community-node-*.*

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: community-node-*

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/community-node:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/community-node:latest
