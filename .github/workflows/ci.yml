name: CI

on:
  pull_request:
  push:
    branches: [main]

# Jobs run only when something they check changed (the `changes` job). A
# change to this workflow, the lockfiles' shared roots or the release scripts
# runs what depends on them; docs-only changes run nothing but `ci-ok`.
# `ci-ok` is the one check to require in branch protection: it fails if any
# job that ran failed, and passes when the rest were skipped.

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ts: ${{ steps.filter.outputs.ts }}
      integration: ${{ steps.filter.outputs.integration }}
      mobile: ${{ steps.filter.outputs.mobile }}
      offline: ${{ steps.filter.outputs.offline }}
      portal: ${{ steps.filter.outputs.portal }}
      node_image: ${{ steps.filter.outputs.node_image }}
      vendors: ${{ steps.filter.outputs.vendors }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            cargo: &cargo
              - Cargo.toml
              - Cargo.lock
              - crates/**
              - apps/node/**
              - tests/vectors/**
            npm: &npm
              - package.json
              - package-lock.json
              - tsconfig.base.json
            packages: &packages
              - packages/**
              - tests/vectors/**
            rust:
              - *ci
              - *cargo
            ts:
              - *ci
              - *npm
              - *packages
              - apps/mobile/**
              - apps/portal/**
              - tests/offline/**
            integration:
              - *ci
              - *cargo
              - *npm
              - *packages
              - apps/portal/**
            mobile:
              - *ci
              - *cargo
              - *npm
              - *packages
              - apps/mobile/**
            offline:
              - *ci
              - *cargo
              - *npm
              - *packages
              - tests/offline/**
            portal:
              - *ci
              - apps/portal/**
              - tsconfig.base.json
            node_image:
              - *ci
              - *cargo
              - deploy/**
            vendors:
              - *ci
              - *cargo
              - *npm
              - *packages
              - deploy/**
              - scripts/check-vendor-independence.mjs
            scripts:
              - *ci
              - scripts/**
              - apps/node/Cargo.toml
              - apps/portal/package.json
              - apps/mobile/app.json

  # Version files and release scripts (scripts/release-version.mjs).
  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/*.test.mjs

  typescript:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # Phase 10: the node protocol must not depend on any cloud vendor.
  vendor-independence:
    needs: changes
    if: needs.changes.outputs.vendors == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-vendor-independence.mjs

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cargo build -p community-node --locked
      - run: npm ci
      - run: npm run build
      - run: npm test -w @vamo-virar/sync
        env:
          VV_NODE_BIN: ${{ github.workspace }}/target/debug/community-node
          VV_REQUIRE_NODE: "1"
      - run: npm test -w @vamo-virar/portal
        env:
          VV_NODE_BIN: ${{ github.workspace }}/target/debug/community-node
          VV_REQUIRE_NODE: "1"

  mobile-web-e2e:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cargo build -p community-node --locked
      - run: npm ci
      - run: npm run build
      - run: npx expo export --platform web --output-dir dist-web
        working-directory: apps/mobile
        env:
          CI: "1"
      - run: npm run e2e:web -w @vamo-virar/mobile
        env:
          CHROME_PATH: /usr/bin/google-chrome
          VV_NODE_BIN: ${{ github.workspace }}/target/debug/community-node
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-screenshots
          path: apps/mobile/e2e/screenshots

  offline-scenarios:
    needs: changes
    if: needs.changes.outputs.offline == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cargo build -p community-node --features test-clock --locked
        env:
          CARGO_TARGET_DIR: target/test-clock
      - run: npm ci
      - run: npm run build
      - run: npm test -w @vamo-virar/offline-tests
        env:
          VV_NODE_TEST_BIN: ${{ github.workspace }}/target/test-clock/debug/community-node
          VV_REQUIRE_NODE: "1"

  portal-image:
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/portal/Dockerfile
          tags: vamo-virar/portal:ci
          load: true
          cache-from: type=gha,scope=portal
          cache-to: type=gha,mode=max,scope=portal
      - name: Container starts and serves the request form
        run: |
          docker run -d --name portal -p 3000:3000 \
            -e PORTAL_PUBLIC_URL=http://127.0.0.1:3000 -e PORTAL_ADMIN_EMAIL=admin@example.org \
            -e PORTAL_ADMIN_PASSWORD=ci-password-123 -e PORTAL_MAIL_FROM=ci@example.org \
            -e VV_OPERATOR_TOKEN=ci-operator-token-123 vamo-virar/portal:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' portal)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' portal | grep -qx healthy
          curl -fsS http://127.0.0.1:3000/ | grep -q 'action="/pedir"'
          test "$(docker inspect -f '{{.Config.User}}' portal)" = "node"

  node-image:
    needs: changes
    if: needs.changes.outputs.node_image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          tags: vamo-virar/community-node:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts healthy and serves discovery
        run: |
          docker run -d --name node -p 8787:8787 vamo-virar/community-node:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' node)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' node | grep -qx healthy
          curl -fsS http://127.0.0.1:8787/.well-known/vamo-virar | grep -q '"protocol":"vv/0"'
          test "$(docker inspect -f '{{.Config.User}}' node)" = "65532:65532"

  ci-ok:
    needs: [changes, scripts, typescript, vendor-independence, rust, integration, mobile-web-e2e, offline-scenarios, portal-image, node-image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a CI job ended $r"; exit 1 ;; esac
          done
