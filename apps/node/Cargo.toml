[package]
name = "community-node"
version = "0.5.0"
description = "vamo-virar community node: sequencer, encrypted mailbox and snapshot store (docs/protocol.md)"
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Test-only endpoints (moving the clock, forcing housekeeping) for the offline
# scenario suite. Never enable in a deployed node.
test-clock = []

[dependencies]
axum = { version = "0.8", features = ["ws"] }
getrandom = "0.3"
# Only for the optional push gateway (§14): one JSON POST per wake-up.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = "1.1.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vv-crypto = { path = "../../crates/vv-crypto" }

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5", features = ["util"] }
